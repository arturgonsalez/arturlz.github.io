      <g fill="#0e1730">
        <rect x="14" y="38" width="8" height="14" rx="1.5"></rect>
        <rect x="28" y="28" width="8" height="24" rx="1.5"></rect>
        <rect x="42" y="16" width="8" height="36" rx="1.5"></rect>
      </g>
      
      <path d="M44 14 L52 14 L52 22" stroke="#0e1730" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>

    
    <text x="-122" y="12" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="500" fill="#fff" letter-spacing="-0.015em">finario</text>
  </g>

  
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.55)" letter-spacing="0.12em">
    <text x="32" y="332">FINTECH · CAPITAL PLANNING SAAS</text>
    <text x="568" y="332" text-anchor="end">2024 — NOW</text>
  </g>

  
  <g transform="translate(32, 36)" stroke="rgba(255,255,255,0.35)" stroke-width="1" fill="none">
