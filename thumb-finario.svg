      <stop offset="0%" stop-color="#0e1730"></stop>
      <stop offset="100%" stop-color="#06101f"></stop>
    </linearGradient>
    <pattern id="fin-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"></path>
    </pattern>
  </defs>

  <rect width="600" height="360" fill="url(#fin-bg)"></rect>
  <rect width="600" height="360" fill="url(#fin-grid)"></rect>

  
  <g stroke="rgba(122,178,255,0.18)" stroke-width="1.5" fill="none">
