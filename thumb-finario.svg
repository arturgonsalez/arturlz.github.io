    <path d="M0 310 L120 290 L220 270 L320 240 L420 220 L520 190 L600 175" stroke="rgba(122,178,255,0.10)"></path>
  </g>

  
  <g transform="translate(300, 180)">
    
    <g transform="translate(-200, -36)">
