    <text x="-104" y="14" font-family="&#39;Inter Tight&#39;, Inter, system-ui, sans-serif" font-size="72" font-weight="600" fill="#fff" letter-spacing="-0.025em">arbolus</text>
  </g>

  
  <text x="300" y="240" text-anchor="middle" font-family="&#39;Inter Tight&#39;, Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.78)" letter-spacing="0.01em">Data that superpowers your due diligence</text>

  
  <g font-family="&#39;JetBrains Mono&#39;, ui-monospace, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.6)" letter-spacing="0.12em">
