      <path d="M54 22 L48 4"></path>
      <path d="M54 22 L64 8"></path>
      
      <circle cx="36" cy="64" r="4" fill="#fff" stroke="none"></circle>
      <circle cx="8" cy="8" r="3.5" fill="#fff" stroke="none"></circle>
      <circle cx="24" cy="4" r="3.5" fill="#fff" stroke="none"></circle>
      <circle cx="48" cy="4" r="3.5" fill="#fff" stroke="none"></circle>
      <circle cx="64" cy="8" r="3.5" fill="#fff" stroke="none"></circle>
